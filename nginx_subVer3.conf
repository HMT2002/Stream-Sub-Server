# =====================================================================
# SUB NODE — main config  ->  /etc/nginx/nginx.conf
# Đi kèm: streamingVer3  ->  /etc/nginx/sites-enabled/default (2 server block :80 và :9150)
# File này CỐ TÌNH không chứa server block nào ("Cách A"): mọi site nằm ở
# sites-enabled. Bản nginx_sub.conf (Ver2) thì ngược lại — gộp server :9150 thẳng
# vào đây ("Cách B"). ĐỪNG dùng lẫn 2 file, sẽ nghe 9150 hai lần -> [emerg].
# =====================================================================

# `www-data` = user của worker process (Ver2 dùng `root`, đã bỏ vì không nên chạy
# worker bằng root). Hệ quả PHẢI biết khi đổi root->www-data: worker mất quyền đọc
# tuyệt đối, nên mọi thư mục CHA của `root` trong site config cần bit +x cho other:
#     sudo chmod o+x /home/ubuntu          # /home/ubuntu mặc định 0750 trên Ubuntu 22.04+
# Thiếu -> 403 Forbidden + error.log "Permission denied" (KHÔNG phải 404).
user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}

http {

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;
        # Giới hạn body cho MỌI server, kể cả :80 proxy tới Node. Upload v2 đi theo
        # chunk nên 100M là đủ; nếu Central đẩy 1 file gốc > 100M qua route upload cũ
        # thì nginx trả 413 TRƯỚC KHI Node thấy request -> nâng số này (hoặc đặt
        # `client_max_body_size 0;` riêng trong location upload) chứ đừng debug ở Node.
        client_max_body_size 100M;

        # ── MIME types KHAI THẲNG (không include) — đặt ở HTTP LEVEL nên áp dụng
        #    cho MỌI server/location, trừ nơi tự khai types{} riêng (types là REPLACE).
        #    Đây là bảng "đuôi file -> Content-Type"; file nào KHÔNG khớp -> rơi vào
        #    default_type (octet-stream) NHƯNG VẪN được serve. => nginx "chấp nhận mọi
        #    dạng file" sẵn; bảng này chỉ để GẮN NHÃN đúng cho loại cần (player/replicate).
        types {
            # --- Streaming (KHÔNG có trong mime.types mặc định) ---
            application/dash+xml                  mpd;
            application/vnd.apple.mpegurl          m3u8;
            video/mp4                              mp4 m4v m4s;   # m4s = media segment fMP4
            audio/mp4                              m4a;
            video/mp2t                             ts;
            application/octet-stream               cmfv cmfa cmft; # CMAF (nếu dùng)

            # --- Phụ đề ---
            text/vtt                               vtt;
            application/x-subrip                   srt;
            text/x-ssa                             ass ssa;

            # --- Video/Audio nguồn (cho replicate file gốc giữa node) ---
            video/x-matroska                       mkv;
            video/webm                             webm;
            video/quicktime                        mov;
            video/x-msvideo                        avi;
            video/x-flv                            flv;
            audio/mpeg                             mp3;
            audio/aac                              aac;
            audio/ogg                              ogg oga;
            audio/x-flac                           flac;
            audio/wav                              wav;

            # --- Web / text / data ---
            text/html                              html htm;
            text/css                               css;
            text/plain                             txt;
            application/javascript                 js mjs;
            application/json                       json;
            application/xml                        xml;
            image/jpeg                             jpg jpeg;
            image/png                              png;
            image/gif                              gif;
            image/webp                             webp;
            image/svg+xml                          svg;
            image/x-icon                           ico;

            # --- Font ---
            font/woff                              woff;
            font/woff2                             woff2;
            font/ttf                               ttf;
            application/vnd.ms-fontobject          eot;

            # --- Nén / đóng gói (replicate) ---
            application/zip                        zip;
            application/gzip                       gz;
            application/x-tar                      tar;
        }
        default_type application/octet-stream;   # catch-all: đuôi lạ vẫn serve (nhãn nhị phân chung)

        ##
        # SSL Settings
        ##

        #ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_protocols TLSv1.2 TLSv1.3;               # bỏ TLSv1/1.1 — deprecated RFC 8996 (2021)
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##

        error_log /var/log/nginx/error.log;

        # ---------------------------------------------------------------------
        # [UPDATED 2026-08-16] log_format BẬT SẴN, không còn là tuỳ chọn.
        #
        # Lý do đổi: từ Phase 1, Node có thể chặn phát bất cứ lúc nào qua
        # `POST /api/v2/playback/blocks`, và nginx là bên THỰC THI lệnh chặn đó.
        # Không có `auth=` trong access.log thì không có cách nào kiểm chứng lệnh
        # chặn có hiệu lực hay không — chỉ còn cách mở trình duyệt thử.
        #
        # PHỤ THUỘC 2 CHIỀU, đọc trước khi sửa:
        # $auth_reason/$auth_session do `auth_request_set` trong streamingVer3 tạo
        # ra. nginx kiểm biến của log_format NGAY LÚC NẠP CONFIG, nên tắt cụm auth
        # mà quên tắt log_format sẽ ra
        #     [emerg] unknown "auth_reason" variable
        # và nginx KHÔNG KHỞI ĐỘNG — mất cả web server, không phải chỉ mất log.
        # (Đúng loại bẫy "cụm nửa vời" ở deployment-hidden-bugs §8.3.)
        # => Tắt auth trong streamingVer3 thì phải comment CẢ log_format lẫn dòng
        #    access_log dùng nó bên dưới.
        # ---------------------------------------------------------------------
        log_format media '$remote_addr $status $body_bytes_sent rt=$request_time '
                         'auth=$auth_reason sess=$auth_session '
                         'authstatus=$upstream_status authtime=$upstream_response_time '
                         'rid=$http_x_request_id range="$http_range" '
                         '"$request" "$http_user_agent"';

        # `buffer=64k flush=5s`: mỗi segment là một dòng log. Một phiên xem 2
        # tiếng với segment 4s sinh ~1800 dòng CHO MỘT NGƯỜI XEM. Ghi không
        # buffer là một syscall write cho mỗi segment, nhân số người xem đồng
        # thời — I/O log cạnh tranh với chính việc gửi video.
        # Đang điều tra sự cố thì tạm bỏ `buffer=... flush=...` để thấy tức thì.
        access_log /var/log/nginx/access.log media buffer=64k flush=5s;

        # Cache kết quả auth (tuỳ chọn — xem khối proxy_cache trong streamingVer3).
        # keys_zone=10m đủ cho ~80k token đang hoạt động; max_size nhỏ vì response
        # auth không có body, chỉ tốn metadata.
        # proxy_cache_path /var/cache/nginx/auth levels=1:2 keys_zone=auth_cache:10m max_size=64m inactive=60s use_temp_path=off;

        ##
        # Gzip Settings
        ##

        gzip on;
        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # LƯU Ý: KHÔNG thêm video/mp4, m4s vào gzip_types — segment đã nén sẵn,
        # gzip lại chỉ tốn CPU mà không giảm byte. Chỉ gzip mpd/m3u8/text nếu cần.
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/dash+xml;

        ##
        # Virtual Host Configs
        ##

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;
}


