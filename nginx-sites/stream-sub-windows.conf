# =============================================================================
# SUB NODE — bản DROP-IN cho WINDOWS
#
# Windows KHÔNG có sites-enabled (đó là quy ước đóng gói của Debian/Ubuntu, không
# phải của nginx). Tạo một lần rồi thả file vào là xong:
#
#   mkdir D:\nginx\conf\sites-enabled  D:\nginx\logs  D:\nginx\temp
#   copy stream-sub-windows.conf  D:\nginx\conf\sites-enabled\
#
# rồi thêm ĐÚNG MỘT DÒNG vào cuối khối `http { }` trong D:\nginx\conf\nginx.conf:
#
#   include sites-enabled/*.conf;
#
# >>> VIẾT SAI DÒNG NÀY LÀ LỖI SỐ 1 KHIẾN "NGINX CHẠY MÀ STREAM KHÔNG LÊN" <<<
# Cả 3 kiểu sai dưới đây đều KHÔNG làm `nginx -t` fail, vì glob khớp 0 file là
# hợp lệ với nginx:
#
#   include /sites-enabled/*.conf;      # dấu / đầu = TUYỆT ĐỐI -> tìm ở gốc ổ đĩa
#   include sites-enabled/*;            # thiếu .conf -> trên Windows khớp cả `.`
#                                       #   và `..` -> [error] ReadFile() ".." failed
#   include D:\nginx\conf\sites-enabled\*;   # backslash là KÝ TỰ ESCAPE của nginx:
#                                       #   `\n` thành newline thật -> [emerg]
#
# Đúng = TƯƠNG ĐỐI + dấu / xuôi + đuôi .conf. `include` giải đường dẫn tương đối
# theo THƯ MỤC CHỨA FILE CONFIG (conf/), khác `root`/`error_log` (giải theo prefix).
#
# XÁC MINH — `nginx -t` KHÔNG trả lời được câu "đã nạp file nào", phải dùng -T hoa:
#
#   D:\nginx\nginx.exe -p D:/nginx -T | findstr "configuration file"
#
# Không thấy tên file này trong danh sách = include chưa trỏ tới nó.
#
#   D:\nginx\nginx.exe -p D:/nginx -t
#   D:\nginx\nginx.exe -p D:/nginx
#
# CHỈ CẦN SỬA MỘT DÒNG: `root` ở server :9150 (đánh dấu  ### SỬA ĐÂY ###).
#
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# KIỂM TRA TRƯỚC TIÊN — trên Windows đây là lỗi hay gặp NHẤT:
#
#     nginx.exe -V 2>&1 | findstr auth_request
#
# Không in ra gì = bản nginx này KHÔNG có `ngx_http_auth_request_module`. Khi đó:
#     [emerg] unknown directive "auth_request"
# và nginx KHÔNG KHỞI ĐỘNG — mất luôn cả web server, không chỉ mất auth.
# Đã xác nhận: `Working-Window-NGINX-Streaming-Server/NGINX.exe` (nginx 1.17.10)
# trong máy dev này THIẾU module đó.
#
# Cách xử lý:
#   - Tải bản chính thức từ https://nginx.org/en/download.html rồi kiểm tra lại -V
#   - Hoặc tạm comment CẢ CỤM auth: 3 dòng `auth_request`/`auth_request_set` và
#     `location = /__auth`. Comment nửa vời (bỏ location mà giữ auth_request) là
#     tái tạo đúng cái bẫy đã gỡ khỏi `nginx.conf` legacy: mỗi segment tốn một
#     subrequest chắc chắn hỏng, còn auth thì không chặn gì.
#
# KHI NÀO DÙNG FILE NÀY, KHI NÀO DÙNG nginx-windows/
#   - File này: MỘT sub node trên máy dev. Thả một file là chạy.
#   - `nginx-windows/`: NHIỀU sub node song song (:9150/:9250/:9350) — bộ đó tách
#     thân chung ra `stream-node-body.conf` và dùng biến `$node_api`, đổi lại mất
#     `upstream{} + keepalive` cho auth subrequest.
#
# KHÁC BẢN LINUX Ở ĐÂU (và vì sao):
#   1. `sendfile off`. Bản Windows không có sendfile() của Linux. Để `on` không
#      lỗi nhưng cũng không có lợi ích đo được -> tắt hẳn cho khỏi hiểu nhầm, và
#      để nhớ rằng MỌI con số benchmark đo trên Windows KHÔNG suy ra cho VM Linux.
#   2. Không `listen [::]:80`. Máy dev thường không bật IPv6; khai vào là [emerg].
#   3. Không `default_server`. Trên Windows file này hay nằm cạnh server mặc định
#      của bản tải về — hai `default_server` cùng cổng là [emerg] duplicate.
#   4. `root` dùng DẤU / XUÔI kèm ký tự ổ đĩa. Backslash là ký tự escape của
#      nginx; đường dẫn có dấu cách thì bọc "nháy kép".
#   5. KHÔNG có lớp lỗi 403 do quyền thư mục: Windows không có mô hình
#      setuid/setgid nên `user` bị bỏ qua, worker chạy bằng chính tài khoản đã gõ
#      lệnh. Đây chính là lý do config chạy ngon ở dev rồi vỡ trên VM Linux.
#
# BẪY: nginx trên Windows KHÔNG tự tắt process cũ. Chạy nginx.exe lần hai khi lần
# đầu chưa stop -> `bind() to 0.0.0.0:9150 failed (10048)`, thủ phạm là chính
# nginx cũ. Kiểm tra bằng `tasklist | findstr nginx`.
# =============================================================================

# =============================================================================
# LOG — [THÊM 2026-08-16]
#
# File này được `include` bên trong `http { }`, nên `log_format` ở đây là
# http-level và hợp lệ. Trên Windows, đường dẫn tương đối được giải theo nginx
# prefix (`-p`), nên `logs/...` là `<prefix>/logs/...`.
#
# BẪY 1 — nginx trên Windows KHÔNG tự tạo thư mục. Thiếu `logs/` là `[emerg]`.
# BẪY 2 — `$auth_reason` do `auth_request_set` trong `location /` tạo ra. Tắt
#         cụm auth mà quên tắt access_log dùng log_format này sẽ ra
#         `[emerg] unknown "auth_reason" variable` và nginx KHÔNG khởi động.
# BẪY 3 — tên log_format phải duy nhất ở http-level; trùng tên = [emerg].
# =============================================================================
log_format stream_sub_media
        '$remote_addr $status $body_bytes_sent rt=$request_time '
        'auth=$auth_reason sess=$auth_session '
        'authstatus=$upstream_status authtime=$upstream_response_time '
        'rid=$http_x_request_id range="$http_range" '
        '"$request" "$http_user_agent"';

log_format stream_sub_api
        '$remote_addr $status $body_bytes_sent rt=$request_time '
        'rid=$http_x_request_id node=$http_x_node_id '
        'ust=$upstream_status urt=$upstream_response_time "$request"';

upstream stream_sub_node {
        server 127.0.0.1:9100;   # Node.js của sub node
        keepalive 32;
}

# =============================================================================
# SERVER 1 — :80  reverse proxy tới Node (CONTROL PLANE)
# Bỏ hẳn block này nếu cổng 80 trên máy dev đã bị IIS/Skype/thứ khác chiếm —
# Central gọi thẳng :9100 khi test local cũng được.
#
# XUNG ĐỘT server_name — ĐỌC TRƯỚC KHI COPY BLOCK NÀY CHO NODE THỨ HAI:
# Một cổng + một `server_name` chỉ thuộc về MỘT server block. Trùng cả hai thì
# nginx chỉ báo
#     [warn] conflicting server name "localhost" on 0.0.0.0:80, ignored
# rồi cho block ĐẦU TIÊN thắng — block sau không bao giờ nhận được request nào.
# Đây chỉ là `[warn]`, `nginx -t` vẫn "test is successful", cực dễ lướt qua.
#
# Hai nguồn xung đột hay gặp nhất:
#   1. Quên tắt server "Welcome to nginx" mặc định trong conf/nginx.conf — nó
#      cũng `listen 80; server_name localhost;`.
#   2. Chạy nhiều sub node trên một máy và copy nguyên khối này cho từng node.
#      Máy dev chỉ có MỘT cổng 80: node thứ hai phải đổi sang :81, :82...
#      (hoặc đổi server_name + trỏ hosts file, hoặc bỏ hẳn — Central gọi thẳng
#      Node :9200 khi test local cũng được).
# =============================================================================
server {
        listen 80;
        server_name localhost;

        access_log logs/stream-sub-api.log stream_sub_api;
        error_log  logs/stream-sub-api-error.log warn;

        # KHÔNG khai CORS ở đây: Node đã tự set bằng middleware `cors` trong
        # app.js. Thêm ở nginx nữa -> header xuất hiện 2 lần -> browser reject.

        location / {
                proxy_pass http://stream_sub_node;

                proxy_http_version 1.1;
                proxy_set_header Connection        "";
                proxy_set_header Host              $host;
                proxy_set_header X-Real-IP         $remote_addr;
                proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # Khớp server.timeout = 125000 của replication v2 (chờ ack tối đa 120s).
                proxy_read_timeout 180s;
                proxy_send_timeout 180s;
                proxy_request_buffering off;
        }
}

# =============================================================================
# SERVER 2 — :9150  serve manifest/segment (DATA PLANE)
# =============================================================================
server {
        listen 9150;
        server_name localhost;

        # Data plane: một dòng log mỗi segment. Buffer để không phải ghi đĩa
        # ~1800 lần cho mỗi phiên xem 2 tiếng. Bỏ `buffer=/flush=` khi đang debug.
        access_log logs/stream-sub-media.log stream_sub_media buffer=64k flush=5s;
        error_log  logs/stream-sub-media-error.log warn;

        # ---------------------------------------------------------------------
        # ### SỬA ĐÂY ###  ROOT = THƯ MỤC GỐC REPO, KHÔNG phải thư mục videos.
        # URL contract là /videos/<key>/init.mpd — đã có sẵn "/videos/", nên trỏ
        # root vào .../videos sẽ thành .../videos/videos/... -> 404 toàn bộ.
        # Dấu / xuôi, không dùng \.
        # ---------------------------------------------------------------------
        root D:/gitrepos/Stream-Sub-Server;

        sendfile off;    # xem ghi chú (1) ở đầu file

        # --- MIME ------------------------------------------------------------
        # `types` là REPLACE chứ không cộng dồn -> khai trọn bảng ở server-level,
        # dùng chung cho `location /` và `@serve`. Giữ ĐỒNG BỘ với bản Linux.
        types {
                application/dash+xml                  mpd;
                application/vnd.apple.mpegurl         m3u8;
                video/mp4                             mp4 m4v m4s;
                audio/mp4                             m4a;
                video/mp2t                            ts;
                application/octet-stream              cmfv cmfa cmft;
                text/vtt                              vtt;
                application/x-subrip                  srt;
                text/x-ssa                            ass ssa;
                image/png                             png;
                image/jpeg                            jpg jpeg;
                image/webp                            webp;
                text/html                             html htm;
                text/plain                            txt;
                application/json                      json;
        }
        default_type application/octet-stream;

        # --- CORS (server-level để `location /` và `@serve` cùng kế thừa) -----
        add_header Access-Control-Allow-Origin   '*' always;
        add_header Access-Control-Allow-Methods  'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers  'Content-Type, Authorization, Range, X-Player-Token, X-Player-Session, X-Request-Id' always;
        add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
        add_header Access-Control-Max-Age        86400 always;
        add_header X-Sub-Node                    $server_port always;   # biết player đang kéo từ node nào

        location / {
                if ($request_method = OPTIONS) { return 204; }   # preflight chạy TRƯỚC auth

                # --- AUTH: cụm 3 phần, bật/tắt CÙNG NHAU -----------------------
                # Công tắc thật ở `AUTH_MODE` trong config.env của Node
                # (off | log | enforce), không phải ở đây.
                auth_request /__auth;
                auth_request_set $auth_session $upstream_http_x_auth_session;
                auth_request_set $auth_reason  $upstream_http_x_auth_reason;

                # Fail-open CHỈ khi Node chết/treo. 401/403 cố tình KHÔNG có trong
                # danh sách -> bị chặn thật.
                error_page 500 502 503 504 = @serve;

                try_files $uri =404;
        }

        location @serve {
                # KHÔNG đặt auth_request ở đây — đệ quy vô hạn.
                try_files $uri =404;
        }

        location = /__auth {
                internal;

                # PHẢI KHỚP routes/authRoute.js. Sai path -> Node 404 -> nginx dịch
                # thành 500 -> rơi vào @serve -> auth im lặng mất tác dụng, mà
                # `nginx -t` vẫn PASS.
                proxy_pass http://stream_sub_node/api/auth/verify;

                proxy_http_version 1.1;
                proxy_set_header Connection     "";
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";

                # Thiếu header này = mất toàn bộ ràng buộc tài nguyên của token.
                proxy_set_header X-Original-URI $request_uri;
                proxy_set_header X-Real-IP      $remote_addr;

                proxy_connect_timeout 1s;
                proxy_read_timeout    2s;
        }
}
