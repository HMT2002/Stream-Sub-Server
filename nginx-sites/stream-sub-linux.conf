# =============================================================================
# SUB NODE — bản DROP-IN cho LINUX
#
#   sudo rm -f /etc/nginx/sites-enabled/default          # xem ghi chú (A) bên dưới
#   sudo cp stream-sub-linux.conf /etc/nginx/sites-enabled/stream-sub.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# CHỈ CẦN SỬA MỘT DÒNG: `root` ở server :9150 (đánh dấu  ### SỬA ĐÂY ###).
# Không cần đụng /etc/nginx/nginx.conf.
#
# -----------------------------------------------------------------------------
# File này là bản TỰ CHỨA, dẫn xuất từ `streamingVer3` (bản chuẩn hiện hành).
# `streamingVer3` + `nginx_subVer3.conf` vẫn là cặp deploy chính thức và là nơi
# đọc để hiểu lý do từng dòng — file này chỉ gộp lại cho trường hợp muốn thả một
# file là chạy. Các bản `nginx.conf`, `streamingVer2`, `nginx_sub.conf`,
# `site-enabled-streaming` giữ nguyên làm LEGACY, không dùng cho deploy mới.
#
# Khác `streamingVer3` đúng hai điểm, đều để tự chứa:
#   1. Khai `types{}` ngay trong server :9150 thay vì dựa vào bảng types ở
#      nginx_subVer3.conf — `mime.types` mặc định KHÔNG có `mpd`/`m4s`.
#   2. Không khai `log_format`/`proxy_cache_path` (http-level, dễ trùng tên với
#      site khác). Cách bật lại xem cuối file.
#
# -----------------------------------------------------------------------------
# KIỂM TRA TRƯỚC TIÊN — `auth_request` KHÔNG có sẵn trong mọi bản nginx:
#
#     nginx -V 2>&1 | grep -o with-http_auth_request_module
#
# Không in ra gì = bản nginx của bạn KHÔNG biên dịch module này. Khi đó nginx báo
#     [emerg] unknown directive "auth_request"
# và KHÔNG KHỞI ĐỘNG ĐƯỢC — không phải "auth không chạy", mà là mất luôn cả web
# server. (Đã gặp thật: nginx 1.17.10 bản Windows trong repo này thiếu module đó.)
#
# Cách xử lý:
#   - Ubuntu/Debian : gói `nginx-full` hoặc `nginx-extras` có sẵn; `nginx-light` KHÔNG.
#                     sudo apt install nginx-full
#   - Bản tự build  : thêm cờ ./configure --with-http_auth_request_module
#   - Chưa cần auth : comment 3 dòng `auth_request` / `auth_request_set` và cả
#                     `location = /__auth` — nhớ comment CẢ CỤM, để nửa vời là
#                     tái tạo đúng cái bẫy đã gỡ khỏi `nginx.conf` legacy.
#
# (A) VÌ SAO PHẢI XOÁ sites-enabled/default:
#     Site mặc định của Debian/Ubuntu đã chiếm `listen 80 default_server`. Hai
#     `default_server` trên cùng cổng = [emerg] duplicate, nginx KHÔNG khởi động.
#     Giữ lại nó mà bỏ `default_server` ở đây thì tệ hơn: request theo IP rơi vào
#     trang "Welcome to nginx" và Central tưởng node chết.
#
#     Trường hợp trùng `server_name` (không phải `default_server`) còn êm hơn nữa
#     và vì thế nguy hiểm hơn: nginx chỉ báo
#         [warn] conflicting server name "_" on 0.0.0.0:80, ignored
#     rồi cho block đầu tiên thắng, `nginx -t` vẫn "successful". Đọc kỹ dòng
#     [warn] chứ không chỉ nhìn chữ successful ở cuối.
#
# (B) SAU KHI CÀI, XÁC MINH FILE ĐÃ THẬT SỰ ĐƯỢC NẠP:
#         sudo nginx -T | grep "^# configuration file"
#     `nginx -t` KHÔNG trả lời được câu này: nếu dòng `include` của distro trỏ
#     sai chỗ thì glob khớp 0 file — mà với nginx đó là HỢP LỆ, nên `-t` vẫn báo
#     "successful" trong khi site không hề tồn tại. Triệu chứng ở tầng trên là
#     "nginx sống mà :9150 connection refused".
#     Chi tiết: markdowns/nginx-config-operations-guide.md §4.1.
# =============================================================================

# =============================================================================
# LOG — [THÊM 2026-08-16] bắt buộc, không còn là tuỳ chọn cuối file
#
# File này được `include` BÊN TRONG khối `http { }` của nginx.conf, nên
# `log_format` ở đây nằm đúng http-level và hợp lệ. (log_format KHÔNG dùng được
# trong `server {}` — đó là lý do bản trước để nó ở phần "tuỳ chọn".)
#
# BA CÁI BẪY, đọc trước khi sửa:
#
#  1. `$auth_reason` / `$auth_session` do `auth_request_set` trong `location /`
#     tạo ra. nginx kiểm biến của `log_format` NGAY LÚC NẠP CONFIG — comment cụm
#     auth mà quên comment `access_log ... stream_sub_media;` sẽ ra
#         [emerg] unknown "auth_reason" variable
#     và nginx KHÔNG KHỞI ĐỘNG. Không phải "mất log", mà là mất cả web server.
#
#  2. Tên `stream_sub_media` phải DUY NHẤT trong toàn bộ http-level. Hai site
#     cùng khai một tên = [emerg] duplicate. Đừng đặt tên chung như `media`.
#
#  3. `buffer=64k flush=5s` KHÔNG phải tối ưu vặt. Mỗi segment là một dòng log;
#     một phiên xem 2 tiếng với segment 4s sinh ~1800 dòng CHO MỘT NGƯỜI. Ghi
#     không buffer là một syscall write cho mỗi segment, nhân số người xem đồng
#     thời — đủ để I/O log cạnh tranh với chính việc gửi video.
#
# Trường được chọn theo đúng thứ cần khi đi tìm nguyên nhân:
#   auth=      lý do Node cho qua/chặn (ok, blocked, expired, resource-mismatch...)
#   sess=      phiên xem, để lần được toàn bộ request của một người
#   ua=/urt=   status và thời gian của subrequest auth -> Node có đang chậm không
#   rid=       X-Request-Id, nối sang log của Node và của Central
# =============================================================================
log_format stream_sub_media
        '$remote_addr $status $body_bytes_sent rt=$request_time '
        'auth=$auth_reason sess=$auth_session '
        'authstatus=$upstream_status authtime=$upstream_response_time '
        'rid=$http_x_request_id range="$http_range" '
        '"$request" "$http_referer" "$http_user_agent"';

# Log của control plane (:80) — ít request, không cần buffer, và cần thấy ngay.
log_format stream_sub_api
        '$remote_addr $status $body_bytes_sent rt=$request_time '
        'rid=$http_x_request_id node=$http_x_node_id '
        'upstream=$upstream_addr ust=$upstream_status urt=$upstream_response_time '
        '"$request"';

upstream stream_sub_node {
        server 127.0.0.1:9100;   # Node.js của sub node
        keepalive 32;            # tái dùng TCP — cần proxy_http_version 1.1 + Connection ""
}

# =============================================================================
# SERVER 1 — :80  reverse proxy tới Node (CONTROL PLANE)
# Cổng duy nhất Central gọi được từ ngoài. 9100 cố tình internal-only, không mở
# firewall (vm-server-setup-guide.md §4.3).
# =============================================================================
server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Control plane: request thưa, cần thấy ngay -> không buffer.
        access_log /var/log/nginx/stream-sub-api.log stream_sub_api;
        error_log  /var/log/nginx/stream-sub-api-error.log warn;

        # KHÔNG khai CORS ở đây: Node đã tự set bằng middleware `cors` trong
        # app.js. Thêm ở nginx nữa -> response có 2 lần cùng header -> browser
        # reject ("contains multiple values").
        # => API path: Node sở hữu CORS. Static path (:9150): nginx sở hữu CORS.

        location / {
                proxy_pass http://stream_sub_node;

                proxy_http_version 1.1;
                proxy_set_header Connection        "";
                proxy_set_header Host              $host;
                proxy_set_header X-Real-IP         $remote_addr;
                proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # Replication v2: server.js đặt server.timeout = 125000 (chờ ack tối đa
                # 120s). Mặc định proxy_read_timeout 60s sẽ cắt giữa chừng và trả 504
                # TRƯỚC KHI Node kịp trả lời -> Central hiểu nhầm node đích đã chết.
                proxy_read_timeout 180s;
                proxy_send_timeout 180s;

                # Upload chunk đi thẳng vào Node, không để nginx buffer lại vào đĩa.
                proxy_request_buffering off;

                # KHÔNG khai error_page cho 5xx: để 502 lộ thẳng ra khi Node chết.
                # Che 502 thành trang tĩnh = nhận 404 mù mờ, debug sai hướng.
        }
}

# =============================================================================
# SERVER 2 — :9150  serve manifest/segment bằng sendfile (DATA PLANE)
# =============================================================================
server {
        listen 9150;
        server_name _;

        # --- LOG DATA PLANE ---------------------------------------------------
        # `buffer=64k flush=5s`: gom nhiều dòng rồi mới ghi. Xem giải thích ở
        # khối `log_format` đầu file — không buffer là một syscall/segment.
        #
        # `flush=5s` là mức thoả hiệp: đủ nhanh để đang debug thì thấy được
        # (chờ tối đa 5 giây), đủ chậm để không ghi liên tục.
        #
        # KHI ĐANG ĐIỀU TRA MỘT SỰ CỐ, tạm bỏ buffer cho log ra tức thì:
        #     access_log /var/log/nginx/stream-sub-media.log stream_sub_media;
        # KHI CẦN TẮT HẲN (node rất đông, đã có metric ở tầng khác):
        #     access_log off;
        # nhưng nhớ: tắt log ở đây là mất luôn dấu vết ai xem gì, và
        # `auth=blocked` là bằng chứng duy nhất cho thấy lệnh chặn có hiệu lực.
        access_log /var/log/nginx/stream-sub-media.log stream_sub_media buffer=64k flush=5s;
        error_log  /var/log/nginx/stream-sub-media-error.log warn;

        # ---------------------------------------------------------------------
        # ### SỬA ĐÂY ###  ROOT = THƯ MỤC GỐC REPO, KHÔNG phải thư mục videos.
        #
        # URL contract của frontend là:  http://<ip>:9150/videos/<key>/init.mpd
        # — bản thân URL ĐÃ chứa sẵn "/videos/". Trỏ root vào .../videos sẽ thành
        # .../videos/videos/<key>/init.mpd -> 404 toàn bộ.
        #
        # BẮT BUỘC absolute: nginx resolve `root` theo nginx prefix (/etc/nginx),
        # KHÔNG theo thư mục hiện hành. Đường dẫn kiểu "D:/..." trên Linux bị coi
        # là RELATIVE -> nginx tìm /etc/nginx/D:/... -> 404 mọi request, trong khi
        # `nginx -t` vẫn báo OK (nginx không kiểm tra root có tồn tại).
        #
        # QUYỀN: worker chạy dưới `www-data`, cần +x trên MỌI thư mục cha:
        #     sudo chmod o+x /home/ubuntu
        # Thiếu bước này -> 403 (không phải 404), log ghi "Permission denied".
        # `videos/` nằm trong .gitignore nên KHÔNG có sau git clone -> phải mkdir.
        # ---------------------------------------------------------------------
        root /home/ubuntu/Stream-Sub-Server;

        sendfile   on;
        tcp_nopush on;
        # aio on; directio 4m;   # cân nhắc bật với file lớn trên Linux/AWS

        # --- MIME ------------------------------------------------------------
        # `types` là REPLACE chứ không cộng dồn, nên khai ở server-level là khai
        # trọn bảng cho cả `location /` lẫn `@serve`. File không khớp vẫn được
        # serve, chỉ rơi vào default_type.
        types {
                # Streaming — KHÔNG có trong mime.types mặc định
                application/dash+xml                  mpd;
                application/vnd.apple.mpegurl         m3u8;
                video/mp4                             mp4 m4v m4s;   # m4s = segment fMP4
                audio/mp4                             m4a;
                video/mp2t                            ts;
                application/octet-stream              cmfv cmfa cmft;
                # Phụ đề
                text/vtt                              vtt;
                application/x-subrip                  srt;
                text/x-ssa                            ass ssa;
                # Ảnh (thumbnail)
                image/png                             png;
                image/jpeg                            jpg jpeg;
                image/webp                            webp;
                # Web/text
                text/html                             html htm;
                text/plain                            txt;
                application/json                      json;
        }
        default_type application/octet-stream;

        # --- CORS ------------------------------------------------------------
        # Đặt ở SERVER-level để cả `location /` lẫn `@serve` cùng kế thừa.
        # `add_header` KHÔNG kế thừa xuống location nào tự khai add_header riêng.
        add_header Access-Control-Allow-Origin   '*' always;
        add_header Access-Control-Allow-Methods  'GET, HEAD, OPTIONS' always;
        # Header tuỳ ý của player BẮT BUỘC liệt kê ở đây, thiếu là preflight fail.
        add_header Access-Control-Allow-Headers  'Content-Type, Authorization, Range, X-Player-Token, X-Player-Session, X-Request-Id' always;
        add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
        add_header Access-Control-Max-Age        86400 always;

        location / {
                # Preflight phải chạy TRƯỚC auth: request OPTIONS không mang được token.
                if ($request_method = OPTIONS) { return 204; }

                # --- AUTH: cụm 3 phần, bật/tắt CÙNG NHAU -----------------------
                # (1) auth_request  (2) auth_request_set  (3) location = /__auth
                # Công tắc thật KHÔNG nằm ở đây mà ở `AUTH_MODE` trong config.env
                # của Node (off | log | enforce) — đổi mức siết chỉ cần
                # `pm2 restart server --update-env`, và mode `log` (đếm số request
                # LẼ RA bị chặn mà vẫn cho qua) là thứ nginx không diễn đạt được.
                auth_request /__auth;
                auth_request_set $auth_session $upstream_http_x_auth_session;
                auth_request_set $auth_reason  $upstream_http_x_auth_reason;

                # FAIL-OPEN CHỈ KHI HẠ TẦNG HỎNG:
                # 401/403 CỐ TÌNH không có trong danh sách -> bị chặn thật.
                # 5xx = Node chết/treo -> vẫn serve file, vì lúc đó nginx là thứ duy
                # nhất còn sống và cắt video người đang xem thiệt hại lớn hơn.
                # >>> MUỐN FAIL-CLOSED TUYỆT ĐỐI: xoá dòng dưới VÀ cả `location @serve`.
                error_page 500 502 503 504 = @serve;

                try_files $uri =404;
        }

        # Fallback khi auth service không trả lời được (xem error_page ở trên).
        # KHÔNG đặt auth_request ở đây — sẽ thành đệ quy vô hạn.
        location @serve {
                try_files $uri =404;
        }

        # nginx hỏi Node: "token này có quyền lấy file này không?"
        # `internal` = chỉ subrequest gọi được; client gõ thẳng /__auth nhận 404.
        location = /__auth {
                internal;

                # ĐƯỜNG DẪN NÀY PHẢI KHỚP routes/authRoute.js. Sai path -> Node trả
                # 404 -> auth_request coi mọi mã khác 2xx/401/403 là lỗi -> 500 ->
                # rơi vào error_page @serve -> AUTH IM LẶNG MẤT TÁC DỤNG.
                # `nginx -t` KHÔNG bắt được lỗi này.
                proxy_pass http://stream_sub_node/api/auth/verify;

                proxy_http_version 1.1;
                proxy_set_header Connection     "";
                proxy_pass_request_body off;          # subrequest không cần body
                proxy_set_header Content-Length "";

                # URI GỐC: subrequest mang URI /api/auth/verify, Node KHÔNG tự biết
                # client đang xin file nào. Thiếu header này thì mọi ràng buộc tài
                # nguyên (token phim A không mở được phim B) mất tác dụng — và không
                # có triệu chứng gì để nhận ra.
                proxy_set_header X-Original-URI $request_uri;
                proxy_set_header X-Real-IP      $remote_addr;

                # Auth phải nhanh hơn segment. Node chỉ verify HMAC (~vài chục µs);
                # chạm timeout này nghĩa là Node đang treo -> để rơi sang nhánh
                # fail-open hạ tầng thay vì bắt người xem chờ.
                proxy_connect_timeout 1s;
                proxy_read_timeout    2s;
        }
}

# =============================================================================
# ĐỌC LOG — công thức có sẵn
# =============================================================================
# Ai đang bị chặn, và vì lý do gì:
#     grep -v 'auth=ok' /var/log/nginx/stream-sub-media.log | tail -50
#
# Đếm theo lý do (thấy ngay nếu bật enforce sẽ chặn nhầm hàng loạt):
#     awk -F'auth=' '{print $2}' /var/log/nginx/stream-sub-media.log \
#       | awk '{print $1}' | sort | uniq -c | sort -rn
#
# Lệnh chặn của Node có thật sự tới nginx không (sau khi POST /api/v2/playback/blocks):
#     grep 'auth=blocked' /var/log/nginx/stream-sub-media.log | tail
#
# Node auth có đang chậm không (authtime tính bằng giây):
#     awk -F'authtime=' '{print $2}' /var/log/nginx/stream-sub-media.log \
#       | awk '$1>0.05' | wc -l
#
# Lần một thao tác xuyên Central -> Sub bằng requestId:
#     grep 'rid=<id>' /var/log/nginx/stream-sub-*.log
#     pm2 logs server --raw | grep '"requestId":"<id>"'
#
# =============================================================================
# TUỲ CHỌN — cần sửa /etc/nginx/nginx.conf (http level)
# =============================================================================
# 1) Cache kết quả auth (giảm tải khi đông người xem):
#      proxy_cache_path /var/cache/nginx/auth levels=1:2 keys_zone=auth_cache:10m
#                       max_size=64m inactive=60s use_temp_path=off;
#    rồi thêm vào `location = /__auth`:
#      proxy_cache           auth_cache;
#      proxy_cache_key       "$http_x_player_token$arg_token$uri";
#      proxy_cache_valid 204 10s;
#      proxy_cache_valid 401 403 3s;
#
#    ĐÁNH ĐỔI — QUAN TRỌNG HƠN TỪ 2026-08-16:
#    `POST /api/v2/playback/blocks` của Node có hiệu lực ở request segment KẾ
#    TIẾP, vì nginx hỏi Node cho mỗi file. Bật cache là hoãn hiệu lực đó đúng
#    bằng `proxy_cache_valid 204` — 10 giây ở ví dụ trên. Với nội dung phải gỡ
#    ngay (yêu cầu bản quyền, lộ link), 10 giây đó là 10 giây vẫn phát.
#    Muốn cả hai: đặt TTL thấp (2-3s), hoặc `proxy_cache_bypass` theo một header
#    mà Node bật lên khi danh sách chặn khác rỗng.
