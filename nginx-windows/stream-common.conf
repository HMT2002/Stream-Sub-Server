# =============================================================================
# stream-common.conf — nạp ở HTTP LEVEL (từ nginx.conf).
# Chứa những thứ DÙNG CHUNG cho mọi sub node: bảng MIME, tham số HTTP, log.
# KHÔNG chứa server block nào — server nằm ở conf/stream-nodes/*.conf.
# Bảng types dưới đây giữ ĐỒNG BỘ với nginx_subVer3.conf (bản Linux) để file
# được gắn nhãn y hệt nhau ở dev và production; lệch nhau là nguồn của lỗi kiểu
# "chạy được trên máy tôi".
# =============================================================================

sendfile      off;    # xem giải thích ở nginx.conf mục 4
tcp_nopush    on;
tcp_nodelay   on;
keepalive_timeout 65;
types_hash_max_size 2048;
server_tokens off;

client_max_body_size 100M;

# ── Bảng "đuôi file -> Content-Type" ─────────────────────────────────────────
# Đặt ở http level nên áp dụng cho MỌI server. File có đuôi không khớp KHÔNG bị
# từ chối — nó rơi vào default_type và vẫn được serve, chỉ là gắn nhãn nhị phân
# chung. Bảng này để gắn ĐÚNG nhãn cho những loại mà player thật sự soi
# Content-Type (mpd/m3u8/m4s/vtt).
types {
    # --- Streaming (KHÔNG có trong mime.types mặc định) ---
    application/dash+xml                   mpd;
    application/vnd.apple.mpegurl          m3u8;
    video/mp4                              mp4 m4v m4s;   # m4s = media segment fMP4
    audio/mp4                              m4a;
    video/mp2t                             ts;
    application/octet-stream               cmfv cmfa cmft; # CMAF (nếu dùng)

    # --- Phụ đề ---
    text/vtt                               vtt;
    application/x-subrip                   srt;
    text/x-ssa                             ass ssa;

    # --- Video/Audio nguồn (cho replicate file gốc giữa node) ---
    video/x-matroska                       mkv;
    video/webm                             webm;
    video/quicktime                        mov;
    video/x-msvideo                        avi;
    video/x-flv                            flv;
    audio/mpeg                             mp3;
    audio/aac                              aac;
    audio/ogg                              ogg oga;
    audio/x-flac                           flac;
    audio/wav                              wav;

    # --- Web / text / data ---
    text/html                              html htm;
    text/css                               css;
    text/plain                             txt;
    application/javascript                 js mjs;
    application/json                       json;
    application/xml                        xml;
    image/jpeg                             jpg jpeg;
    image/png                              png;
    image/gif                              gif;
    image/webp                             webp;
    image/svg+xml                          svg;
    image/x-icon                           ico;

    # --- Font ---
    font/woff                              woff;
    font/woff2                             woff2;
    font/ttf                               ttf;
    application/vnd.ms-fontobject          eot;

    # --- Nén / đóng gói (replicate) ---
    application/zip                        zip;
    application/gzip                       gz;
    application/x-tar                      tar;
}
default_type application/octet-stream;

gzip on;
# KHÔNG thêm video/mp4, m4s vào gzip_types — segment đã nén sẵn, gzip lại chỉ
# tốn CPU mà không giảm byte.

# ── Log ──────────────────────────────────────────────────────────────────────
# $server_port trong format giúp phân biệt request của sub nào khi chạy 3 node
# cùng lúc — thứ mà bản Linux (1 node/VM) không cần.
log_format multinode '[:$server_port] $remote_addr "$request" $status '
                     '${body_bytes_sent}b rt=$request_time';
access_log logs/access.log multinode;

# Muốn log kèm kết quả auth thì dùng format dưới đây THAY CHO dòng trên.
# CẢNH BÁO PHỤ THUỘC: $auth_reason/$auth_session do `auth_request_set` trong
# stream-node-body.conf tạo ra. Nếu khối auth ở đó bị comment mà format này vẫn
# bật, nginx báo [emerg] unknown "auth_reason" variable và KHÔNG khởi động.
# log_format multinode_auth '[:$server_port] $remote_addr "$request" $status '
#                           '${body_bytes_sent}b rt=$request_time '
#                           'auth=$auth_reason sess=$auth_session';
# access_log logs/access.log multinode_auth;
