# =============================================================================
# nginx.conf — BẢN CHO WINDOWS (test đa sub node trên 1 máy dev)
# Chép cả thư mục này vào <nginx>/conf/ rồi chạy nginx.exe. Xem README.md kèm theo.
#
# KHÁC GÌ SO VỚI BẢN LINUX (nginx_subVer3.conf) — và VÌ SAO:
#
#  1. KHÔNG có `user`.
#     `user` bảo nginx hạ quyền worker xuống một user hệ điều hành. Windows
#     không có mô hình setuid/setgid POSIX đó, nginx bản Windows bỏ qua và in
#     warning "the "user" directive is not supported on this platform".
#     Worker chạy bằng chính tài khoản đã gõ lệnh nginx.exe.
#     => Trên Windows KHÔNG BAO GIỜ gặp lớp lỗi 403 do thiếu quyền thư mục —
#        đây chính là lý do config chạy ngon ở dev rồi vỡ trên VM Linux.
#
#  2. KHÔNG có `pid /run/nginx.pid`.
#     /run là thư mục của Linux. Ở đây để relative -> nginx tự đặt trong prefix.
#
#  3. KHÔNG có `include /etc/nginx/modules-enabled/*.conf` và
#     `include /etc/nginx/sites-enabled/*` — sites-available/sites-enabled là
#     QUY ƯỚC ĐÓNG GÓI CỦA DEBIAN/UBUNTU, không phải của nginx. Bản tải về cho
#     Windows không có 2 thư mục đó.
#
#  4. `sendfile off`.
#     Bản Windows không có sendfile() của Linux. Để `on` không gây lỗi nhưng
#     cũng không mang lại lợi ích đo được -> mọi con số benchmark đo trên Windows
#     KHÔNG suy ra được cho VM Linux. Tắt hẳn cho khỏi hiểu nhầm.
#
# BẪY ĐƯỜNG DẪN (khác nhau giữa `include` và mọi directive còn lại):
#   - `include` tương đối resolve theo THƯ MỤC CHỨA FILE CONFIG (<nginx>/conf/)
#     -> vì vậy `include stream-common.conf;` mới chạy được.
#   - `root`, `error_log`, `pid`, `access_log` tương đối resolve theo PREFIX
#     (<nginx>/) -> `logs/error.log` = <nginx>/logs/error.log.
#   Nhớ nhầm 2 cái này là nguồn gốc của phần lớn [emerg] lúc khởi động.
#
# nginx KHÔNG tự tạo thư mục: phải có sẵn <nginx>/logs và <nginx>/temp.
# =============================================================================

worker_processes 1;      # Windows: dù khai nhiều worker, thực tế chỉ 1 cái làm việc

error_log  logs/error.log warn;    # BẮT BUỘC có ≥1 error_log ở main context.
                                   # KHÔNG viết `error_log off;` — nginx sẽ tạo
                                   # một FILE TÊN "off" chứ không phải tắt log.
pid        logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Bảng MIME + CORS + tham số chung cho mọi sub node.
    # CỐ Ý không `include mime.types;`: `types` là REPLACE chứ không cộng dồn,
    # nên trộn 2 nguồn types sẽ mất bảng này hoặc mất bảng kia. Khai một chỗ duy nhất.
    include stream-common.conf;

    # Mỗi sub node = 1 file trong conf/stream-nodes/.
    # THÊM NODE MỚI = COPY 1 FILE, SỬA 3 SỐ. Không đụng file này.
    # Wildcard nên thư mục rỗng cũng không sao (`include file-literal.conf` thiếu
    # file mới là [emerg]).
    include stream-nodes/*.conf;
}
