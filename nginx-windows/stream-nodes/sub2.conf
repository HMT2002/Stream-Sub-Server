# =============================================================================
# SUB NODE #2  —  SERVERINDEX=2  ·  nginx :9250  ·  Node.js :9200
# Bản sao của sub1.conf, chỉ khác 3 dòng (1)(2)(3). Xem sub1.conf để biết lý do
# từng dòng — ở đây chỉ giữ phần cần sửa cho gọn.
# =============================================================================

server {
    listen 9250;                                  # (1)
    server_name localhost;

    set $node_api 127.0.0.1:9200;                 # (2)

    # (3) Bản clone thứ 2 của repo, có config.env riêng với SERVERINDEX=2.
    #     Mỗi node PHẢI có thư mục videos riêng — trỏ 2 node vào cùng 1 root thì
    #     không còn mô phỏng được replication (node nào cũng "sẵn có" mọi file).
    root D:/gitrepos/Stream-Sub-Server-2;

    include stream-node-body.conf;
}
