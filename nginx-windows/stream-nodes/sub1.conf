# =============================================================================
# SUB NODE #1  —  SERVERINDEX=1  ·  nginx :9150  ·  Node.js :9100
#
# THÊM NODE MỚI = COPY FILE NÀY THÀNH subN.conf VÀ SỬA ĐÚNG 3 DÒNG ĐÁNH DẤU (1)(2)(3).
# Công thức cổng của dự án (server.js): PORT + SERVERINDEX * SERVERREP
#   SERVERINDEX=1 -> Node 9100 -> nginx 9150
#   SERVERINDEX=2 -> Node 9200 -> nginx 9250
#   SERVERINDEX=3 -> Node 9300 -> nginx 9350
# =============================================================================

server {
    listen 9150;                                  # (1) CỔNG NGINX của node này
    server_name localhost;

    set $node_api 127.0.0.1:9100;                 # (2) CỔNG NODE.JS tương ứng

    # (3) THƯ MỤC GỐC REPO của node này — KHÔNG phải thư mục videos.
    #     URL contract là /videos/<tên>/init.mpd, tức đã có sẵn đoạn "/videos/",
    #     nên trỏ root vào .../videos sẽ thành .../videos/videos/... -> 404.
    #     Dùng DẤU / xuôi, không dùng \ (backslash là ký tự escape của nginx).
    #     Đường dẫn có dấu cách thì bọc "nháy kép".
    root D:/gitrepos/Stream-Sub-Server;

    # Toàn bộ location + auth + CORS dùng chung, đừng sửa ở đây:
    include stream-node-body.conf;
}
