# =============================================================================
# stream-node-body.conf — THÂN CHUNG của mọi sub node, nạp bên TRONG server{}.
#
# Ý tưởng: file server của mỗi node (conf/stream-nodes/subN.conf) chỉ khai 3 thứ
# KHÁC NHAU giữa các node — `listen`, `root`, `$node_api` — rồi `include` file
# này để lấy toàn bộ phần giống nhau. Sửa logic 1 lần, cả 3 node cùng đổi.
#
# ĐÁNH ĐỔI ĐÃ BIẾT: vì `proxy_pass` phải dùng biến `$node_api` (mỗi node trỏ Node
# js khác cổng), nginx KHÔNG dùng được `upstream{}` + `keepalive` cho auth
# subrequest -> mỗi lần gọi auth là một kết nối TCP mới tới Node. Trên máy dev
# (localhost, vài client) không đáng kể. Bản Linux production thì ngược lại: 1
# node/VM nên khai `upstream` cố định và giữ keepalive 32.
# =============================================================================

# CORS ở SERVER-LEVEL để cả "location /" lẫn "location @serve" cùng kế thừa.
add_header Access-Control-Allow-Origin   '*' always;
add_header Access-Control-Allow-Methods  'GET, HEAD, OPTIONS' always;
add_header Access-Control-Allow-Headers  'Content-Type, Authorization, Range, X-Player-Token, X-Player-Session' always;
add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
add_header Access-Control-Max-Age        86400 always;

# Cho biết request được phục vụ bởi node nào — cực kỳ hữu ích khi test 3 node
# song song và cần biết player đang thật sự kéo từ đâu.
add_header X-Sub-Node                    $server_port always;

location / {
    if ($request_method = OPTIONS) { return 204; }   # preflight chạy TRƯỚC auth

    # ── AUTH — cụm 3 phần, bật/tắt cùng nhau ────────────────────────────────
    # Công tắc thật nằm ở AUTH_MODE trong config.env của từng Node
    # (off | log | enforce), không phải ở đây.
    auth_request /__auth;
    auth_request_set $auth_session $upstream_http_x_auth_session;
    auth_request_set $auth_reason  $upstream_http_x_auth_reason;

    # Fail-open CHỈ khi Node chết/treo (5xx). 401/403 cố tình KHÔNG có trong
    # danh sách -> bị chặn thật.
    error_page 500 502 503 504 = @serve;

    try_files $uri =404;
}

location @serve {
    # KHÔNG đặt auth_request ở đây — sẽ thành đệ quy vô hạn.
    try_files $uri =404;
}

location = /__auth {
    internal;
    proxy_pass http://$node_api/api/auth/verify;

    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI  $request_uri;   # thiếu header này = mất toàn bộ ràng buộc tài nguyên
    proxy_set_header X-Real-IP       $remote_addr;

    proxy_connect_timeout 1s;
    proxy_read_timeout    2s;
}
